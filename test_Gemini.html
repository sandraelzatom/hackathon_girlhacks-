<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Gemini API Invoke test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
    .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>

  <h1>🧪 Gemini API connection test</h1>

  <div class="box">
    <label>1. input Gemini API Key:</label><br>
    <input type="password" id="apiKey" placeholder="AIzaSy..." style="width: 300px; padding: 5px;">
    <p><small>* no key? go to <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a> 免费获取。</small></p>
  </div>

  <div class="box">
    <label>2. choose files (PDF / 图片 / TXT):</label><br>
    <input type="file" id="fileInput" style="margin-top: 10px;">
  </div>

  <button id="testBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">🚀 发送请求给 Gemini API</button>

  <h3 id="status">status get ready</h3>
  <div id="output"></div>

  <!-- logic code -->
  <script src="logic.js"></script>

  <script>
    document.getElementById("testBtn").addEventListener("click", async () => {
      const apiKey = document.getElementById("apiKey").value.trim();
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");

      if (!apiKey) {
        alert("Please Input Gemini API Key!");
        return;
      }
      if (!file) {
        alert("please choose a test file!");
        return;
      }

      statusEl.className = "";
      statusEl.innerText = "⏳ uploading files and waiting for Gemini API to response...";
      outputEl.innerHTML = "";

      try {
        console.log("invoking window.GroveLogic.analyzeFileAndGenerateQuiz...");
        
        // 🌟 核心点：这里正式触发 logic.js 中的 Gemini 网络请求
        const result = await window.GroveLogic.analyzeFileAndGenerateQuiz(file, apiKey);
        
        console.log("Gemini API return data analysis retults :", result);
        statusEl.className = "success";
        statusEl.innerText = "✅ API success here's the output:";
        outputEl.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;

      } catch (error) {
        console.error("find the detail of falier:", error);
        statusEl.className = "error";
        statusEl.innerText = `❌ API invoke fail : ${error.message}`;
        outputEl.innerHTML = `<p class="error"> (open control panel F12 -> Console / Network) see details。</p>`;
      }
    });
  </script>
</body>
</html>
