<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enchanted Grove – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="grove-login-body">
  <div class="grove-login-glow"></div>

  <div class="grove-login-container">
    <h1 class="grove-title">🌙 Enchanted Grove</h1>
    <p class="grove-subtitle">Step into the forest of starlight blessings.</p>

    <form class="grove-login-form" action="/login" method="POST">
      <label class="grove-label">
        <span>Forest Name</span>
        <input type="text" name="username" required placeholder="e.g., Lisa" class="grove-input" />
      </label>

      <label class="grove-label">
        <span>Secret Pathword</span>
        <input type="password" name="password" required placeholder="••••••••" class="grove-input" />
      </label>

      <button type="submit" class="grove-button grove-button-primary">
        Enter the Grove ✨
      </button>
    </form>

    <div class="grove-fireflies">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>
