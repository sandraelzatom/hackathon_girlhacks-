<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grove Test Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    h3 { margin-top: 28px; }
    button { padding: 8px 14px; margin: 4px 4px 0 0; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 8px; white-space: pre-wrap; min-height: 40px; }
    .ok { color: #1a7f37; } .err { color: #cf222e; }
  </style>
</head>
<body>
  <h2>Grove Test Page</h2>
  <p id="status">Checking...</p>

  <h3>1. Account &amp; progress</h3>
  <button id="init">Load my progress (init)</button>
  <button id="dew">+100 dew</button>
  <button id="note">Add a note</button>
  <button id="local">Show local state</button>
  <button id="server">Show what the SERVER saved</button>
  <button id="reset">Reset progress</button>
  <button id="logout">Log out</button>
  <pre id="out1">Click "Load my progress" first.</pre>

  <h3>2. Gemini</h3>
  <input type="file" id="file" accept=".pdf,.txt,.png,.jpg,.jpeg" />
  <br />
  <button id="run">Analyze &amp; generate quiz</button>
  <button id="fallback">Show fallback quiz</button>
  <pre id="out2">Nothing yet.</pre>

  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script>
    const status = document.getElementById("status");
    const out1 = document.getElementById("out1");
    const out2 = document.getElementById("out2");
    const show = (el, data) => { el.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2); };

    // Who is logged in?
    GroveLogic.getCurrentUser().then((user) => {
      if (user) {
        status.innerHTML = '<span class="ok">Logged in as <b></b></span>';
        status.querySelector("b").textContent = user.username;
      } else {
        status.innerHTML = '<span class="err">Not logged in.</span> <a href="/login.html?next=/test.html">Go to login</a>';
      }
    });

    document.getElementById("init").onclick = async () => {
      show(out1, "Loading...");
      show(out1, await GroveLogic.init());
    };
    document.getElementById("dew").onclick = () => {
      GroveLogic.addDew(100);
      show(out1, GroveLogic.getState());
    };
    document.getElementById("note").onclick = () => {
      GroveLogic.addNote("Test note " + new Date().toLocaleTimeString());
      show(out1, GroveLogic.getState());
    };
    document.getElementById("local").onclick = () => show(out1, GroveLogic.getState());

    // Reads straight from the server, so you can verify progress was really saved there.
    // Progress uploads 0.5s after a change, so wait a moment after clicking +100 dew.
    document.getElementById("server").onclick = async () => {
      const res = await fetch("/api/state");
      show(out1, res.ok ? await res.json() : "Error " + res.status + " (are you logged in?)");
    };
    document.getElementById("reset").onclick = () => show(out1, GroveLogic.resetState());
    document.getElementById("logout").onclick = () => GroveLogic.logout();

    document.getElementById("run").onclick = async () => {
      const file = document.getElementById("file").files[0];
      if (!file) { show(out2, "Please choose a file first."); return; }
      show(out2, "Analyzing...");
      try {
        show(out2, await GroveLogic.analyzeFileAndGenerateQuiz(file));
      } catch (err) {
        show(out2, "Error: " + err.message);
      }
    };
    document.getElementById("fallback").onclick = () => show(out2, GroveLogic.getFallbackQuiz());
  </script>
</body>
</html>
